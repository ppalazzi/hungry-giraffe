name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` needs a lockfile and installs exactly what it pins.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Runs tsc before vite build, so this type-checks as well as bundles.
      - name: Build
        run: npm run build
